
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Real-Time Chat Application</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- SockJS -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

    <!-- STOMP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.1/stomp.min.js"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Main Chat Container */
        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 650px;
            background: #ffffff;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .chat-header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 20px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .chat-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
        }

        .chat-title {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
        }

        .online-status {
            font-size: 12px;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 3px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        /* Chat Area */
        #chat {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background: #f8fafc;
        }

        #chat::-webkit-scrollbar {
            width: 7px;
        }

        #chat::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* Message */
        .message {
            display: flex;
            margin-bottom: 15px;
            animation: messageAppear 0.25s ease;
        }

        .message-bubble {
            max-width: 75%;
            background: white;
            padding: 12px 16px;
            border-radius: 16px 16px 16px 4px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07);
            border: 1px solid #e2e8f0;
        }

        .message-sender {
            font-size: 12px;
            font-weight: 700;
            color: #6366f1;
            margin-bottom: 4px;
        }

        .message-content {
            font-size: 14px;
            color: #334155;
            word-wrap: break-word;
        }

        /* User Input Area */
        .input-area {
            padding: 18px 22px;
            background: white;
            border-top: 1px solid #e2e8f0;
        }

        .name-input {
            margin-bottom: 12px;
        }

        .form-control {
            border: 1px solid #dbe1ea;
            border-radius: 12px;
            padding: 12px 15px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .message-row {
            display: flex;
            gap: 10px;
        }

        .message-row .form-control {
            flex: 1;
        }

        /* Send Button */
        #sendMessage {
            border: none;
            border-radius: 12px;
            padding: 0 24px;
            font-weight: 600;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            transition: all 0.2s ease;
        }

        #sendMessage:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 7px 18px rgba(79, 70, 229, 0.3);
        }

        #sendMessage:active {
            transform: scale(0.97);
        }

        #sendMessage:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Animation */
        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            body {
                padding: 0;
            }

            .chat-container {
                height: 100vh;
                border-radius: 0;
            }

            .chat-header {
                padding: 16px 18px;
            }

            #chat {
                padding: 18px;
            }

            .input-area {
                padding: 14px;
            }

            .message-bubble {
                max-width: 85%;
            }

            #sendMessage {
                padding: 0 18px;
            }
        }
    </style>
</head>

<body>

<div class="chat-container">

    <!-- Header -->
    <div class="chat-header">
        <div class="header-left">

            <div class="chat-icon">
                💬
            </div>

            <div>
                <h1 class="chat-title">Real-Time Chat</h1>

                <div class="online-status">
                    <span class="online-dot"></span>
                    Connected
                </div>
            </div>

        </div>

        <div>
            <span style="font-size: 13px; opacity: 0.8;">
                Live
            </span>
        </div>
    </div>


    <!-- Chat Messages -->
    <div id="chat"></div>


    <!-- Input Area -->
    <div class="input-area">

        <div class="name-input">
            <input
                    id="senderInput"
                    type="text"
                    class="form-control"
                    placeholder="Enter your name..."
            />
        </div>

        <div class="message-row">

            <input
                    id="messageInput"
                    type="text"
                    class="form-control"
                    placeholder="Type a message..."
                    autocomplete="off"
            />

            <button
                    id="sendMessage"
                    class="btn btn-primary"
                    disabled>
                Send ➤
            </button>

        </div>

    </div>

</div>


<script>

    let stompClient = null;

    function setConnected(connected) {
        document.getElementById('sendMessage').disabled = !connected;
    }


    function connect() {

        const socket = new SockJS('/chat');

        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {

            console.log('Connected: ' + frame);

            setConnected(true);

            stompClient.subscribe('/topic/messages', function (message) {

                showMessage(JSON.parse(message.body));

            });

        }, function (error) {

            console.error('Connection error:', error);

            setConnected(false);

        });
    }


    function showMessage(message) {

        const chat = document.getElementById('chat');

        const messageElement = document.createElement('div');

        messageElement.className = 'message';

        messageElement.innerHTML = `
            <div class="message-bubble">
                <div class="message-sender">
                    ${escapeHtml(message.sender)}
                </div>

                <div class="message-content">
                    ${escapeHtml(message.content)}
                </div>
            </div>
        `;

        chat.appendChild(messageElement);

        chat.scrollTop = chat.scrollHeight;
    }


    function sendMessage() {

        const sender =
            document.getElementById('senderInput').value.trim();

        const content =
            document.getElementById('messageInput').value.trim();

        if (!sender || !content) {
            return;
        }

        const chatMessage = {
            sender: sender,
            content: content
        };

        stompClient.send(
            "/app/sendMessage",
            {},
            JSON.stringify(chatMessage)
        );

        document.getElementById('messageInput').value = '';

        document.getElementById('messageInput').focus();
    }


    /* Prevent HTML injection */
    function escapeHtml(text) {

        const div = document.createElement('div');

        div.textContent = text;

        return div.innerHTML;
    }


    /* Send message with Enter */
    document.getElementById('messageInput')
        .addEventListener('keydown', function (event) {

            if (event.key === 'Enter') {

                event.preventDefault();

                sendMessage();
            }
        });


    document.getElementById('sendMessage')
        .addEventListener('click', sendMessage);


    window.onload = connect;

</script>

</body>
</html>
